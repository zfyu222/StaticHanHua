<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏图片文字审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b22;color:#e8edf3;font:15px "Microsoft YaHei",sans-serif}header{padding:16px 22px;background:#252c38;position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0 0 8px}button,select,input,textarea{font:inherit}button,select{padding:6px 10px;margin:3px;background:#354156;border:1px solid #65738b;color:white;border-radius:4px;cursor:pointer}button.active{background:#23605c}main{display:grid;grid-template-columns:220px minmax(360px,1fr) 370px;gap:16px;padding:16px}aside,.panel{background:#222a35;padding:12px;border-radius:7px;min-width:0}#images{max-height:72vh;overflow:auto}#images button{display:block;text-align:left;width:100%;word-break:break-all;font-size:12px}#stage{position:relative;display:inline-block;max-width:100%;background:#888;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}#picture{display:block;max-width:100%;max-height:72vh;object-fit:contain;image-rendering:pixelated}canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}textarea{width:100%;min-height:100px;background:#10161e;color:#fff;padding:8px;border:1px solid #637084}#regions{max-height:38vh;overflow:auto}.region{border:1px solid #526078;padding:9px;margin:8px 0;cursor:pointer;overflow-wrap:anywhere}.selected{border:2px solid #67dbc9}.muted{color:#a8b6c9;font-size:13px}#warning{color:#ffc981;white-space:pre-wrap}#sources{overflow-wrap:anywhere;max-height:160px;overflow:auto}#status{font-weight:bold}#summary{margin-left:14px;color:#bce6db}@media(max-width:1050px){main{grid-template-columns:180px 1fr}.editor{grid-column:1/-1}}input[type=file]{max-width:230px}label{display:inline-block;margin:4px}
</style>
<header><h1>游戏图片文字审核</h1><div class="muted">未检出 ≠ 无文字。OCR结果须人工确认；可框选漏检文字。页面不联网、不修改游戏。</div>
<button id="save">下载审核文件</button><label>载入审核文件 <input id="import" type="file" accept=".json"></label><span id="summary"></span></header>
<main><aside><select id="filter"><option value="all">全部图片</option><option value="text_candidate">检测候选</option><option value="needs_review">疑难文字</option><option value="not_detected">未检出，待抽查</option><option value="scan_failed">扫描失败</option><option value="not_scanned">未扫描</option><option value="low_priority">低优先级，待抽查</option><option value="vision">离线复核建议</option><option value="screen_excluded">预测排除，可抽查</option></select><input id="search" placeholder="搜索资源名或文字" style="width:100%;margin:6px 0"><div id="images"></div></aside>
<div class="panel"><div id="status"></div><p id="sources" class="muted"></p><label>缩放 <select id="zoom"><option value="fit">适应视口</option><option value="1">原尺寸</option><option value="2">2倍</option><option value="4">4倍</option><option value="8">8倍</option></select></label><div id="viewport" style="overflow:auto;max-height:72vh"><div id="stage" style="max-width:none"><img id="picture" style="max-width:none;max-height:none" alt="当前原图"><canvas id="canvas"></canvas></div></div><p><button id="previous">上一张</button><button id="next">下一张</button><button id="draw">框选漏检文字</button><button id="background">切换底色</button></p><label>图片结论 <select id="imageDecision"><option value="unreviewed">未审核</option><option value="has_text">确认有字</option><option value="confirmed_no_text">人工确认无字</option><option value="uncertain">无法确定</option></select></label><div id="warning"></div></div>
<div class="panel editor"><h2 style="font-size:17px">文字区域</h2><div id="regions"></div><div id="editor" hidden><p id="regionMeta" class="muted"></p><textarea id="text" spellcheck="false"></textarea><p><button id="accept">确认文字</button><button id="reject">误报／忽略</button><button id="pending">待复核</button></p><pre id="evidence" class="muted" style="white-space:pre-wrap"></pre></div><p class="muted">可把多行文字框成一段，确认后导出一条CSV记录。原OCR候选可标为忽略。下载的JSON须通过命令行校验后才能导出。</p></div></main>
<script>
'use strict';
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const storageKey='image-text-review-'+DATA.scan_hash;
let review={schema:1,scan_hash:DATA.scan_hash,regions:[],images:[]};
try{const saved=localStorage.getItem(storageKey);if(saved)review=JSON.parse(saved);}catch(e){}
let current=null,selected=null,draw=false,start=null,visible=[],bg=0;
const labels={text_candidate:'存在较稳定OCR候选，待审核',needs_review:'仅疑似文字，可能是纹理，待审核',not_detected:'未检出，未经人工确认',scan_failed:'扫描有错误，不能判为无字',not_scanned:'尚未扫描'};
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(review));}catch(e){$('warning').textContent='浏览器无法自动暂存，请及时下载审核文件。';}updateSummary();}
function entry(region,image=current){let row=review.regions.find(x=>x.region_id===region.region_id);if(!row){row={region_id:region.region_id,image_id:image.image_id,box:region.box,text:region.text,decision:'pending',...(region.manual?{manual:true}:{})};review.regions.push(row);}return row;}
function rows(image=current){if(!image)return [];const found=new Set(image.regions.map(r=>r.region_id));return image.regions.concat(review.regions.filter(r=>r.image_id===image.image_id&&r.manual&&!found.has(r.region_id)));}
function imageDecision(image=current){return review.images.find(x=>x.image_id===image.image_id)?.decision||'unreviewed';}
function updateSummary(){$('summary').textContent=`已确认 ${review.regions.filter(r=>r.decision==='accept').length} 个文字区；人工无字 ${review.images.filter(x=>x.decision==='confirmed_no_text').length} 张；解码错误 ${DATA.inventory_errors.length} 项`;}
function list(){const filter=$('filter').value,q=$('search').value.toLowerCase();visible=DATA.images.filter(im=>(filter==='all'||(filter==='screen_excluded'?im.screen_keep===false:filter==='low_priority'?im.priority==='low':filter==='vision'?im.vision.length>0:filter==='needs_review'?im.regions.some(r=>r.status==='needs_review'):im.status===filter))&&(!q||JSON.stringify(im.sources).toLowerCase().includes(q)||rows(im).some(r=>(r.text||'').toLowerCase().includes(q))));$('images').replaceChildren();for(const im of visible){const b=document.createElement('button');b.textContent=im.sources.map(s=>s.path).join(', ')+' · '+im.width+'×'+im.height;b.classList.toggle('active',current?.image_id===im.image_id);b.onclick=()=>open(im);$('images').append(b);}updateSummary();}
function open(im){current=im;selected=null;$('editor').hidden=true;$('status').textContent=(labels[im.status]||im.status)+' · 复核优先级 '+im.priority+(im.screen_keep===false?' · 预测排除，非确认无字':'');$('sources').textContent=im.sources.map(s=>s.path+' '+JSON.stringify(s.provenance)).join('\n');$('warning').textContent=(im.errors||[]).map(e=>e.stage+': '+e.error).concat((im.vision||[]).map(v=>'离线建议（待人工确认）：'+v.presence+' · '+v.reason)).join('\n');$('imageDecision').value=imageDecision();$('picture').src='images/'+im.image_id+'.png';$('picture').onload=zoom;renderRegions();list();}
function zoom(){if(!current)return;const scale=$('zoom').value==='fit'?Math.min(4,($('viewport').clientWidth-2)/current.width,700/current.height):Number($('zoom').value);$('picture').style.width=Math.max(1,current.width*scale)+'px';$('picture').style.height=Math.max(1,current.height*scale)+'px';paint();}
$('zoom').onchange=zoom;
function paint(){if(!current)return;const canvas=$('canvas'),ctx=canvas.getContext('2d');canvas.width=current.width;canvas.height=current.height;const scale=Math.max(1,current.width/650);ctx.lineWidth=2*scale;for(const r of rows()){const d=review.regions.find(x=>x.region_id===r.region_id)?.decision||'pending';ctx.strokeStyle=d==='accept'?'#52efab':d==='reject'?'#999':'#ffcb55';if(r.region_id===selected?.region_id)ctx.strokeStyle='#53d9ff';const [x,y,right,bottom]=r.box;ctx.strokeRect(x,y,right-x,bottom-y);}if(start&&start.end){ctx.strokeStyle='#fff';ctx.strokeRect(start.x,start.y,start.end.x-start.x,start.end.y-start.y);}}
function renderRegions(){$('regions').replaceChildren();for(const r of rows()){const d=review.regions.find(x=>x.region_id===r.region_id);const node=document.createElement('div');node.className='region'+(selected?.region_id===r.region_id?' selected':'');node.textContent=(d?.decision||'pending')+' · '+(d?.text??r.text??'')+(r.recognition_score===undefined?'':` [识别分数 ${r.recognition_score.toFixed(2)}]`);node.onclick=()=>select(r);$('regions').append(node);}paint();}
function select(r){selected=r;const row=entry(r);$('editor').hidden=false;$('text').value=row.text;$('regionMeta').textContent='原图坐标 '+r.box.map(x=>x.toFixed(1)).join(', ');$('evidence').textContent=JSON.stringify(r.alternatives||[],null,2);renderRegions();}
function decide(decision){if(!selected)return;const row=entry(selected);if(decision==='accept'&&!$('text').value.trim()){alert('确认文字不能为空');return;}if(decision==='accept'&&imageDecision()==='confirmed_no_text'){alert('请先把图片结论改为确认有字');return;}row.text=$('text').value;row.decision=decision;persist();renderRegions();}
$('accept').onclick=()=>decide('accept');$('reject').onclick=()=>decide('reject');$('pending').onclick=()=>decide('pending');
$('text').oninput=()=>{if(selected){const row=entry(selected);row.text=$('text').value;row.decision='pending';persist();}};
$('imageDecision').onchange=()=>{if($('imageDecision').value==='confirmed_no_text'&&review.regions.some(r=>r.image_id===current.image_id&&r.decision==='accept')){alert('此图已有确认文字');$('imageDecision').value=imageDecision();return;}let row=review.images.find(x=>x.image_id===current.image_id);if(!row){row={image_id:current.image_id};review.images.push(row);}row.decision=$('imageDecision').value;persist();};
$('filter').onchange=list;$('search').oninput=list;
function move(delta){const index=visible.findIndex(x=>x.image_id===current?.image_id);if(visible.length)open(visible[(index+delta+visible.length)%visible.length]);}
$('next').onclick=()=>move(1);$('previous').onclick=()=>move(-1);
$('draw').onclick=()=>{draw=!draw;$('draw').classList.toggle('active',draw);$('canvas').style.cursor=draw?'crosshair':'default';};
function point(e){const rect=$('canvas').getBoundingClientRect();return {x:Math.max(0,Math.min(current.width,(e.clientX-rect.left)*current.width/rect.width)),y:Math.max(0,Math.min(current.height,(e.clientY-rect.top)*current.height/rect.height))};}
$('canvas').onpointerdown=e=>{if(!draw)return;start=point(e);$('canvas').setPointerCapture(e.pointerId);};
$('canvas').onpointermove=e=>{if(start){start.end=point(e);paint();}};
$('canvas').onpointerup=e=>{if(!start)return;const end=point(e),box=[Math.min(start.x,end.x),Math.min(start.y,end.y),Math.max(start.x,end.x),Math.max(start.y,end.y)];start=null;if(box[2]-box[0]>1&&box[3]-box[1]>1){const r={region_id:'manual-'+crypto.randomUUID(),image_id:current.image_id,box,text:'',decision:'pending',manual:true};review.regions.push(r);select(r);persist();}paint();};
$('background').onclick=()=>{bg=(bg+1)%3;$('stage').style.background=bg===1?'#eee':bg===2?'#181818':'';};
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(review,null,2)],{type:'application/json'}));a.download='review-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('import').onchange=async()=>{try{const next=JSON.parse(await $('import').files[0].text());if(next.scan_hash!==DATA.scan_hash||!Array.isArray(next.regions)||!Array.isArray(next.images))throw new Error('审核文件与本次扫描不匹配');review=next;persist();if(current)open(current);}catch(e){alert(e.message);}};
list();if(visible.length)open(visible[0]);
</script></html>
